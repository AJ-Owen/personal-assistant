[project]
name = "assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "anthropic>=0.111,<1",  # 1.x is a breaking upgrade (httpx2) — migrate deliberately
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "mcp>=1.28,<2",  # 2.x renamed streamablehttp_client
    "httpx>=0.27",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
